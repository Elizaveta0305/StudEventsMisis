name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack
        run: zip -r /tmp/bundle.zip . -x ".git/*" ".github/*" ".gitignore" "README.md" "deploy-receiver.php"

      - name: Upload bundle over HTTPS
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -F "bundle=@/tmp/bundle.zip" \
            "$DEPLOY_URL"
          echo