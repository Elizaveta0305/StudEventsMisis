name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack
        run: zip -r /tmp/bundle.zip . -x ".git/*" ".github/*" ".gitignore" "README.md" "deploy-receiver.php"

      - name: Upload bundle over HTTPS
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "token length: ${#DEPLOY_TOKEN}"
          code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -F "token=$DEPLOY_TOKEN" \
            -F "bundle=@/tmp/bundle.zip" \
            "$DEPLOY_URL")
          echo "HTTP $code"
          head -c 500 /tmp/response.txt
          echo
          [ "$code" = "200" ]