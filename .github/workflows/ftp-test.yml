name: FTP test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Sizes
        run: ls -l assets/logo assets/ui

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: A - lftp, data not encrypted
        continue-on-error: true
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          set net:max-retries 1
          debug 3
          put -O assets/logo/ assets/logo/misis_logo.png
          bye
          EOF

      - name: B - lftp, active mode
        continue-on-error: true
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ftp:passive-mode off
          set ssl:verify-certificate no
          set net:max-retries 1
          debug 3
          put -O assets/logo/ assets/logo/misis_logo.png
          bye
          EOF

      - name: C - lftp, small packets
        continue-on-error: true
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          set net:socket-maxseg 1000
          set net:max-retries 1
          debug 3
          put -O assets/logo/ assets/logo/misis_logo.png
          bye
          EOF

      - name: D - curl, data encrypted
        continue-on-error: true
        run: |
          curl -v --ssl-reqd --insecure \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T assets/logo/misis_logo.png \
            "ftp://$FTP_SERVER/assets/logo/misis_logo.png" 2>&1 | tail -40